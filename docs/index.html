<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperYosh's osu! Workshop</title>
    <link rel="icon" type="image/x-icon" href="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fstatic.wikia.nocookie.net%2Fosugame%2Fimages%2F4%2F41%2FOsu_new_logo.png%2Frevision%2Flatest%3Fcb%3D20220105150330&f=1&nofb=1&ipt=7e9e0474fc2a67a09ff4d4abab2d8db1b6e90b7983d7b03f3db6e8272c85ce8f">
    <link rel="stylesheet" href="viso.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,600;0,800;1,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE SETTINGS --- */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #09090b;
            overflow-x: hidden;
            cursor: none !important;
            /* Override Viso accent with pink theme */
            --viso-accent: #ec4899;
            --viso-accent-dim: #db2777;
            --viso-accent-glow: rgba(236, 72, 153, 0.4);
        }

        /* Force hide cursor on everything */
        * { cursor: none !important; }
        
        h1, h2, h3, .brand-font { font-family: 'Exo 2', sans-serif; }

        /* --- GPU CURSOR ENGINE --- */
        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            z-index: 100000; /* Top most layer */
            pointer-events: none; 
            will-change: transform; 
            transform: translate3d(-100px, -100px, 0); 
        }

        /* Layer 1: The Scaler (Handles size changes) */
        #cursor-scaler {
            transition: transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Hover State Logic (Expands) */
        #custom-cursor.active #cursor-scaler {
            transform: scale(1.3); 
        }

        /* --- CHANGE 1: Click State Logic (Shrinks) --- */
        /* This selector ensures clicking overrides hovering */
        #custom-cursor.clicking #cursor-scaler {
            transform: scale(0.75) !important;
        }

        /* Layer 2: The Spinner (The actual image) */
        #cursor-img {
            width: 80px; 
            height: auto;
            animation: osuSpin 10s linear infinite; 
        }

        /* Layer 3: The Static Crosshair (Sibling to Scaler) */
        /* This moves with the cursor, but does NOT rotate or scale */
        #cursor-crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        /* The actual cross lines */
        #cursor-crosshair::before, #cursor-crosshair::after {
            content: '';
            position: absolute;
            background: white;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            border-radius: 2px;
        }
        /* Horizontal line */
        #cursor-crosshair::before {
            top: 4px; left: 0; width: 10px; height: 2px;
        }
        /* Vertical line */
        #cursor-crosshair::after {
            top: 0; left: 4px; width: 2px; height: 10px;
        }

        @keyframes osuSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- TRAIL CANVAS --- */
        #trail-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99999; /* Just below cursor */
        }

        /* --- OPTIMIZED BACKGROUND --- */
        .area {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            background: #09090b;
            background: radial-gradient(circle at center, #18181b 0%, #000000 100%);
            z-index: -1;
            pointer-events: none; 
        }

        .circles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; margin: 0; padding: 0;
        }

        .circles li {
            position: absolute; display: block; list-style: none;
            width: 20px; height: 20px;
            background: rgba(255, 102, 170, 0.15); 
            animation: animate 25s linear infinite;
            bottom: -150px;
        }

        @keyframes animate {
            0%{ transform: translateY(0) rotate(0deg); opacity: 1; }
            100%{ transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }
        
        .circles li:nth-child(1){ left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2){ left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; background: rgba(59, 130, 246, 0.15); }
        .circles li:nth-child(3){ left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4){ left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; background: rgba(168, 85, 247, 0.15); }
        .circles li:nth-child(5){ left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6){ left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7){ left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .circles li:nth-child(8){ left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .circles li:nth-child(9){ left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .circles li:nth-child(10){ left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        /* --- PERFORMANCE UI --- */
        .solid-panel {
            background: rgba(15, 15, 18, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
        }
        
        /* Card styles using Viso glassmorphism with pink accent */
        .solid-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(48, 54, 61, 0.6);
            border-radius: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .solid-card:hover {
            border-color: rgba(236, 72, 153, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(236, 72, 153, 0.2);
        }

        /* --- MODAL --- */
        #image-modal { 
            background-color: rgba(0, 0, 0, 0.95); 
            opacity: 0;
            pointer-events: none; 
            transition: opacity 0.2s ease;
            display: flex; 
        }
        
        #image-modal.show-modal { 
            opacity: 1; 
            pointer-events: auto; 
        }
    </style>
</head>
<body data-theme="viso" class="selection:bg-pink-500 selection:text-white">

    <canvas id="trail-canvas"></canvas>

    <div id="custom-cursor">
        <div id="cursor-scaler">
            <img src="cursor.png" id="cursor-img" alt="cursor">
        </div>
        <div id="cursor-crosshair"></div>
    </div>

    <div class="area">
        <ul class="circles">
            <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        </ul>
    </div>

    <div id="image-modal" class="fixed inset-0 z-[100] items-center justify-center p-4" onclick="app.closeImage()">
        <div class="relative max-w-5xl w-full">
            <button class="absolute -top-10 right-0 text-white hover:text-pink-500 text-xl font-bold transition-colors">CLOSE [X]</button>
            <img id="modal-img" src="" class="w-full h-auto rounded border border-white/10 bg-zinc-900">
            <p id="modal-caption" class="text-center mt-4 text-pink-400 font-mono font-bold tracking-widest uppercase"></p>
        </div>
    </div>

    <nav class="fixed w-full z-50 solid-panel">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold tracking-wider italic uppercase text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">SuperYosh's osu! Workshop</span>
            </div>
            <div class="flex gap-4 text-sm font-semibold text-zinc-400" id="nav-socials"></div>
        </div>
    </nav>

    <header class="relative pt-40 pb-20 px-6 text-center z-10">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-pink-600/10 rounded-full blur-[60px] -z-10 pointer-events-none"></div>

        <h1 class="font-black italic tracking-tighter mb-4 text-white" style="font-size: clamp(3rem, 10vw, 8rem); line-height: 0.85;">
            Click The Circles
        </h1>
        
        <p class="text-xl md:text-2xl text-zinc-300 max-w-2xl mx-auto font-light" id="hero-subtitle">
            Loading...
        </p>

        <div class="mt-12 flex flex-wrap justify-center gap-3">
            <button onclick="app.filterVersion('lazer')" class="viso-btn viso-btn-primary version-btn active skew-x-[-10deg]">Lazer</button>
            <button onclick="app.filterVersion('both')" class="viso-btn viso-btn-secondary version-btn skew-x-[-10deg] hover:border-purple-500 hover:text-purple-400">Both</button>
            <button onclick="app.filterVersion('stable')" class="viso-btn viso-btn-secondary version-btn skew-x-[-10deg] hover:border-blue-500 hover:text-blue-400">Stable</button>
        </div>
        <div class="mt-4 flex flex-wrap justify-center gap-3">
            <button onclick="app.filterType('all')" class="viso-btn viso-btn-primary type-btn active skew-x-[-10deg]">All</button>
            <button onclick="app.filterType('skin')" class="viso-btn viso-btn-secondary type-btn skew-x-[-10deg] hover:border-pink-500 hover:text-pink-400">Skins</button>
            <button onclick="app.filterType('tool')" class="viso-btn viso-btn-secondary type-btn skew-x-[-10deg] hover:border-blue-500 hover:text-blue-400">Tools</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pb-24 z-10 relative">
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <footer class="max-w-7xl mx-auto px-6 pb-8 pt-16 text-center">
        <div class="viso-card-solid py-8 px-6">
            <p class="text-zinc-400 text-sm mb-4">
                <strong class="text-white">DISCLAIMER:</strong> I used AI to help make most of this site.
            </p>
            <div class="viso-divider"></div>
            <p class="text-zinc-500 text-sm">
                This page uses the <a href="https://github.com/SuperYosh23/VisoDesign" target="_blank" class="text-pink-400 hover:text-pink-300 transition-colors font-semibold">Viso</a> design system.
            </p>
        </div>
    </footer>

    <script>
        // --- 1. THE CURSOR ENGINE (Now with Trails) ---
        const cursor = document.getElementById('custom-cursor');
        const canvas = document.getElementById('trail-canvas');
        const ctx = canvas.getContext('2d');
        const offset = 40; 
        
        // Setup Canvas Size
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // State
        let mouseX = -100;
        let mouseY = -100;
        let isHovering = false;
        
        // Trail History Array
        // We store {x, y} points here
        const trailPoints = [];
        const trailLength = 30; // How long the tail is

        // Mouse Listeners
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            const target = e.target;
            if (target.tagName === 'A' || target.tagName === 'BUTTON' || target.closest('.card-hover') || target.closest('.filter-btn')) {
                if (!isHovering) {
                    isHovering = true;
                    cursor.classList.add('active');
                }
            } else {
                if (isHovering) {
                    isHovering = false;
                    cursor.classList.remove('active');
                }
            }
        });

        // --- CHANGE 1: ADD CLICK LISTENER ---
        document.addEventListener('mousedown', () => {
            cursor.classList.add('clicking');
        });
        document.addEventListener('mouseup', () => {
            cursor.classList.remove('clicking');
        });

        // RENDER LOOP (Handles Physics + Drawing)
        let currentX = -100;
        let currentY = -100;

        function render() {
            // 1. Move Cursor
            // LERP 1.0 = Instant. LERP 0.15 = Smooth dragging.
            // Using 1.0 for snappy response as requested previously
            const lerp = 1.0; 
            currentX += (mouseX - offset - currentX) * lerp;
            currentY += (mouseY - offset - currentY) * lerp;
            
            cursor.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

            // 2. Draw Trail
            // We want the trail to come from the CENTER of the cursor.
            // currentX is top-left, so we add 'offset' to center it.
            const centerX = currentX + offset;
            const centerY = currentY + offset;

            // Add new point to history
            trailPoints.push({ x: centerX, y: centerY });
            
            // Remove old points
            if (trailPoints.length > trailLength) {
                trailPoints.shift();
            }

            // Clear Canvas
            ctx.clearRect(0, 0, width, height);

            // Draw Line
            ctx.beginPath();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            // Loop through points to draw the line
            for (let i = 0; i < trailPoints.length - 1; i++) {
                const p1 = trailPoints[i];
                const p2 = trailPoints[i + 1];
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                
                // Calculate opacity based on index (fade out at the end)
                // Newest points (end of array) are opacity 1. Oldest are 0.
                const opacity = i / trailPoints.length;
                
                ctx.lineWidth = 2; // Thin line
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.stroke();
            }

            requestAnimationFrame(render);
        }
        render();

        // --- 2. APP LOGIC ---
        let db = {
            "subtitle": "Random osu!-related stuff I've been working on :P",
            "socials": [], 
            "items": []
        };

        const app = {
            currentVersion: 'lazer',
            currentType: 'all',
            
            init: async () => {
                try {
                    const response = await fetch('items.json');
                    const data = await response.json();
                    db = data;
                } catch (error) {
                    console.error('Error loading items:', error);
                }
                
                document.getElementById('hero-subtitle').innerText = db.subtitle;
                const socialContainer = document.getElementById('nav-socials');
                db.socials.forEach(s => {
                    if(s.name) socialContainer.innerHTML += `<a href="${s.url}" target="_blank" class="hover:text-white uppercase tracking-widest text-xs">${s.name}</a>`;
                });
                
                // Only filter after data is loaded
                if (db.items && db.items.length > 0) {
                    app.applyFilters();
                }
            },

            filterVersion: (version) => {
                app.currentVersion = version;
                app.updateVersionButtons();
                app.applyFilters();
            },

            filterType: (type) => {
                app.currentType = type;
                app.updateTypeButtons();
                app.applyFilters();
            },

            updateVersionButtons: () => {
                document.querySelectorAll('.version-btn').forEach(btn => {
                    const txt = btn.innerText.toLowerCase();
                    const isLazerBtn = txt === 'lazer';
                    const isBothBtn = txt === 'both';
                    const isStableBtn = txt === 'stable';

                    if (txt === app.currentVersion) {
                        btn.className = "viso-btn viso-btn-primary version-btn active skew-x-[-10deg]";
                    } else {
                        let hoverClasses = "hover:border-zinc-500 hover:text-white";
                        if (isLazerBtn) hoverClasses = "hover:border-pink-500 hover:text-pink-400";
                        if (isBothBtn) hoverClasses = "hover:border-purple-500 hover:text-purple-400";
                        if (isStableBtn) hoverClasses = "hover:border-blue-500 hover:text-blue-400";
                        btn.className = `viso-btn viso-btn-secondary version-btn skew-x-[-10deg] ${hoverClasses}`;
                    }
                });
            },

            updateTypeButtons: () => {
                document.querySelectorAll('.type-btn').forEach(btn => {
                    const txt = btn.innerText.toLowerCase();
                    const isSkinBtn = txt === 'skins';
                    const isToolBtn = txt === 'tools';
                    const isAllBtn = txt === 'all';

                    if (txt === app.currentType || (app.currentType === 'all' && isAllBtn)) {
                        btn.className = "viso-btn viso-btn-primary type-btn active skew-x-[-10deg]";
                    } else {
                        let hoverClasses = "hover:border-zinc-500 hover:text-white";
                        if (isSkinBtn) hoverClasses = "hover:border-pink-500 hover:text-pink-400";
                        if (isToolBtn) hoverClasses = "hover:border-blue-500 hover:text-blue-400";
                        btn.className = `viso-btn viso-btn-secondary type-btn skew-x-[-10deg] ${hoverClasses}`;
                    }
                });
            },

            applyFilters: () => {
                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                let filteredItems = db.items;

                // Filter by version (always filter since there's no "all" option)
                filteredItems = filteredItems.filter(i => {
                    if (app.currentVersion === 'both') {
                        return i.version === 'both';
                    }
                    return i.version === app.currentVersion;
                });

                // Filter by type
                if (app.currentType !== 'all') {
                    filteredItems = filteredItems.filter(i => {
                        if (Array.isArray(i.type)) {
                            return i.type.includes(app.currentType);
                        }
                        return i.type === app.currentType;
                    });
                }

                const data = filteredItems;

                data.forEach(item => {
                    let imageContent;
                    let imageSource = null;

                    if (item.image && item.image.length > 5) {
                        imageContent = `<img src="${item.image}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 group-hover:rotate-1">`;
                        imageSource = item.image;
                    } else {
                        // Handle gradient colors for multiple types
                        let colors;
                        if (Array.isArray(item.type)) {
                            if (item.type.includes('skin') && item.type.includes('layout')) {
                                colors = 'from-pink-600 via-purple-600 to-amber-600';
                            } else if (item.type.includes('skin')) {
                                colors = 'from-pink-600 to-purple-900';
                            } else if (item.type.includes('tool')) {
                                colors = 'from-blue-600 to-cyan-900';
                            } else {
                                colors = 'from-amber-600 to-orange-900';
                            }
                        } else {
                            colors = item.type === 'skin' ? 'from-pink-600 to-purple-900' : 
                                   item.type === 'tool' ? 'from-blue-600 to-cyan-900' : 'from-amber-600 to-orange-900';
                        }
                        imageContent = `<div class="w-full h-full bg-gradient-to-br ${colors} flex items-center justify-center"><span class="text-4xl font-black italic text-white/20 uppercase">${Array.isArray(item.type) ? item.type.join('+') : item.type}</span></div>`;
                    }

                    // Handle multiple types
                    let typeDisplay;
                    if (Array.isArray(item.type)) {
                        typeDisplay = item.type.join(' + ');
                    } else {
                        typeDisplay = item.type;
                    }
                    
                    // --- CHANGE 2: BUTTON TEXT LOGIC ---
                    const buttonText = item.btnText || "Download/Open";

                    const card = document.createElement('div');
                    card.className = "solid-card overflow-hidden card-hover group flex flex-col h-full cursor-pointer";
                    card.onclick = () => window.location.href = `item.html?id=${item.id}`;

                    card.innerHTML = `
                        <div class="h-48 relative overflow-hidden bg-zinc-900 pointer-events-none border-b border-white/5">
                            ${imageContent}
                            <div class="absolute top-0 right-0 bg-black/80 px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-white border-l border-b border-pink-500/50">
                                ${typeDisplay}
                            </div>
                        </div>
                        <div class="p-5 flex-1 flex flex-col">
                            <h3 class="text-xl font-bold text-white mb-1 group-hover:text-pink-400 transition-colors italic">${item.title}</h3>
                            <div class="w-10 h-1 bg-gradient-to-r from-pink-500 to-purple-500 mb-3 rounded-full"></div>
                            <p class="text-zinc-400 text-sm mb-6 leading-relaxed">${item.desc}</p>
                            <div class="mt-auto pt-4 border-t border-white/5">
                                <a href="${item.link}" target="_blank" onclick="event.stopPropagation()" class="viso-btn viso-btn-primary w-full text-center">
                                    ${buttonText}
                                </a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            },

            openImage: (src, title) => {
                const modal = document.getElementById('image-modal');
                document.getElementById('modal-img').src = src;
                document.getElementById('modal-caption').innerText = title;
                modal.classList.add('show-modal');
            },

            closeImage: () => {
                const modal = document.getElementById('image-modal');
                modal.classList.remove('show-modal');
                setTimeout(() => { document.getElementById('modal-img').src = ""; }, 200);
            }
        };

        app.init();
    </script>
</body>
</html>
